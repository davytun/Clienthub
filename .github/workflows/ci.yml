name: CI — Security, Quality & Performance

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# Cancel older runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"

# ─────────────────────────────────────────────────────────────────────────────
# Shared setup used by every job via a reusable step pattern.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. CODE STYLE ────────────────────────────────────────────────────────────
  code-style:
    name: "Code Style (Pint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint (check only — no auto-fix in CI)
        run: ./vendor/bin/pint --test
        # Exits 1 if any file would be changed. Fix locally with: ./vendor/bin/pint

  # ── 2. STATIC ANALYSIS ───────────────────────────────────────────────────────
  static-analysis:
    name: "Static Analysis (Larastan level 6)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env && php artisan key:generate

      - name: Run Larastan
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M --error-format=github
        # --error-format=github produces inline annotations on the PR diff

  # ── 3. CODE IMPROVEMENT HINTS ────────────────────────────────────────────────
  rector:
    name: "Code Improvements (Rector — dry run)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Rector (dry run — reports improvements, does not apply them)
        run: ./vendor/bin/rector process --dry-run --output-format=github-actions
        continue-on-error: true
        # Informational only — won't fail the pipeline, but reports what can be improved

  # ── 4. SECURITY SCAN ─────────────────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: "PHP — Composer audit (known CVEs in dependencies)"
        run: composer audit --format=table
        # Fails if any installed package has a known vulnerability

      - name: "JS — npm audit (high/critical only)"
        run: npm audit --audit-level=high
        # Audit levels: info | low | moderate | high | critical
        continue-on-error: true
        # npm audit often flags transitive deps you can't control; set to true
        # and tighten to `false` once deps are clean

      - name: "Config — Check .env.example has no real secrets"
        run: |
          if grep -E '(password|secret|key)\s*=\s*\S+' .env.example | grep -iv 'example\|your_\|change_\|placeholder\|APP_KEY=base64'; then
            echo "::error::Possible real secret found in .env.example"
            exit 1
          fi
          echo "No secrets found in .env.example"

      - name: "Config — Verify APP_DEBUG is false in .env.example"
        run: |
          if grep -q 'APP_DEBUG=true' .env.example; then
            echo "::warning::APP_DEBUG=true in .env.example — ensure production .env sets this to false"
          fi
          echo "Debug check passed"

  # ── 5. TESTS ─────────────────────────────────────────────────────────────────
  tests:
    name: "Tests (PHPUnit + Coverage)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env and generate key
        run: cp .env.example .env && php artisan key:generate

      - name: Run migrations (SQLite in-memory, set in phpunit.xml)
        run: php artisan migrate --env=testing --force

      - name: Run PHPUnit
        run: php artisan test --coverage --min=50
        # --min=50 enforces a minimum 50% coverage floor. Raise it as you add tests.
        env:
          XDEBUG_MODE: coverage

  # ── 6. ASSET BUILD ───────────────────────────────────────────────────────────
  assets:
    name: "Asset Build & Bundle Size"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "### Asset bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzip |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          # Parse vite manifest for generated asset names
          node -e "
            const manifest = require('./public/build/manifest.json');
            const fs = require('fs');
            const path = require('path');
            Object.values(manifest).forEach(asset => {
              if (!asset.file) return;
              const file = './public/build/' + asset.file;
              if (!fs.existsSync(file)) return;
              const size = (fs.statSync(file).size / 1024).toFixed(1);
              console.log('| ' + asset.file + ' | ' + size + ' KB | — |');
            });
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Warn if any JS bundle exceeds 300 KB
          node -e "
            const fs = require('fs');
            const manifest = require('./public/build/manifest.json');
            let failed = false;
            Object.values(manifest).forEach(asset => {
              if (!asset.file || !asset.file.endsWith('.js')) return;
              const file = './public/build/' + asset.file;
              if (!fs.existsSync(file)) return;
              const kb = fs.statSync(file).size / 1024;
              if (kb > 300) {
                console.error('::warning:: Bundle ' + asset.file + ' is ' + kb.toFixed(1) + ' KB (>300 KB)');
                failed = true;
              }
            });
          "

  # ── SUMMARY ──────────────────────────────────────────────────────────────────
  # Aggregates all job results into a single required check for branch protection.
  ci-pass:
    name: "CI Passed"
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis, security, tests, assets]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [name for name, data in needs.items() if data['result'] not in ('success', 'skipped')]
          if failed:
              print('Failed jobs: ' + ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          "
